<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>First Habbda ever</title>
    <link rel="stylesheet" href="css/Stylesheet.css" />
  </head>

  <body>
    <header>
      <h1>My Blog</h1>

      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <main>
      <h2>Contact Us</h2>

      <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required />

        <br /><br />

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />

        <br /><br />

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" />

        <br /><br />

        <label for="date">Date:</label>
        <input type="date" id="date" name="date" />

        <br /><br />

        <label>Preferred contact method:</label>

        <input type="radio" id="phone" name="contact" value="phone" />
        <label for="phone">Phone</label>

        <input type="radio" id="emailContact" name="contact" value="email" />
        <label for="emailContact">Email</label>

        <br /><br />

        <label>What are you interested in?</label>

        <input type="checkbox" id="sport" name="interest" value="sport" />
        <label for="sport">Sport</label>

        <input type="checkbox" id="music" name="interest" value="music" />
        <label for="music">Music</label>

        <input type="checkbox" id="reading" name="interest" value="reading" />
        <label for="reading">Reading</label>

        <br /><br />

        <label for="subject">Subject:</label>

        <select id="subject" name="subject">
          <option value="question">Question</option>
          <option value="feedback">Feedback</option>
          <option value="other">Other</option>
        </select>

        <br /><br />

        <label for="message">Message:</label>
        <br />

        <textarea id="message" name="message" rows="6" cols="40"></textarea>

        <br /><br />

        <button type="submit">Submit</button>
      </form>
    </main>

    <footer>
      <p>&copy; 2026 My Blog</p>
    </footer>
  </body>
</html>
